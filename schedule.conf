# Settings of the weekly visual review (scheduled.sh, switched on with schedule.sh).
# Shell syntax; after changing the time, run `.grok-bot/schedule.sh install` again.

WEEKDAY=1          # 0 or 7 Sunday, 1 Monday … 6 Saturday
HOUR=6             # local time; a Mac asleep then runs it when it wakes
MINUTE=42

BASE=main          # the branch reviewed
FROM_GITHUB=1      # 1: as it is on GitHub (fetched first; your working copy is not touched); 0: as it is on this Mac
MAX_USD=3          # Grok budget per run, in USD; what is left over waits for the next run
KEEP_RUNS=8        # visual runs kept in runs/ (older ones are deleted); 0 keeps all
SWEEP_VARIANTS=""  # empty: the 8 basic variants; "all" once tablet and large desktops are in
REVIEW_VARIANTS="" # empty: the 5 that Grok reviews by default
BACKUP=1           # after each run, push the kit to GitHub (backup.sh); 0 skips it
